[package]
name = "desktop-pet"
version = "0.1.0"
description = "跨平台桌面宠物"
authors = ["you"]
edition = "2021"

[lib]
name = "desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
log = "0.4"
env_logger = "0.11"
# ── 方案 D:Rust 原生宠物渲染(透明悬浮,绕开 WebKitGTK alpha 硬伤)──
# gtk/cairo/glib 复用 tauri 依赖树中的 0.18 系(零新增系统库);
# image 复用 tauri 的 image-png feature 引入的 0.25 系(仅启用 png 解码)。
gtk = "0.18"
cairo-rs = "0.18"
glib = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
# layer-shell 提升(2026-08-09 集成):把 GTK 窗口提升为 wlr-layer-shell 表面,
# Overlay 层悬浮所有窗口之上 + ARGB 直接混合,根治普通 toplevel 的主题背景填充。
# 0.8.2 依赖 gtk ^0.18 兼容;系统库 libgtk-layer-shell(VM 已装 0.10.1,
# pkg-config gtk-layer-shell-0)由 gtk-layer-shell-sys 自动链接。
# v0_6 feature:启用 set_keyboard_mode(KeyboardMode::None 排除键盘)。
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
# ── P1-5 阈值告警系统通知 ──
# notify-rust:Linux 桌面通知(org.freedesktop.Notifications)。用 zbus
# 后端(纯 Rust,无 libdbus 系统库依赖);通知 daemon 缺失时 show() 报错
# 被静默忽略,不影响主通道(宠物警示动画)。env MO_NOTIFY=0 可关闭。
notify-rust = { version = "4", default-features = false, features = ["z"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
