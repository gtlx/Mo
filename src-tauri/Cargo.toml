[package]
name = "desktop-pet"
version = "0.1.0"
description = "跨平台桌面宠物"
authors = ["you"]
edition = "2021"

[lib]
name = "desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
log = "0.4"
env_logger = "0.11"
# ── 方案 D:Rust 原生宠物渲染(透明悬浮,绕开 WebKitGTK alpha 硬伤)──
# gtk/cairo/glib 复用 tauri 依赖树中的 0.18 系(零新增系统库);
# image 复用 tauri 的 image-png feature 引入的 0.25 系(仅启用 png 解码)。
gtk = "0.18"
cairo-rs = "0.18"
glib = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
